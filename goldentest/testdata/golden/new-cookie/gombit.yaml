# Project choices recorded by `gombit new`. Runtime configuration is read
# from the process environment (see .env.example), not this file.
name: demo
module: github.com/example/demo
database: sqlite
cache: memory
# Bearer JWT is the v0.1 API default (C3). `--auth cookie` records HttpOnly
# session cookies + CSRF; see docs/auth-cookie.md and .env.example for the
# GOMBIT_AUTH_MODE / GOMBIT_COOKIE_* settings this wires.
auth: cookie
# Minimal/headless is the default (C4). `--ui mui` scaffolds the MUI CRUD
# preset (ThemeProvider, AppBar, Table, TextField). See docs/frontend-mui.md.
ui: minimal
api_prefix: /api/v1

# Upgrade baseline (gombit upgrade): the format of this block, and the
# scaffold conventions the app was generated with. The framework version is
# go.mod's, and is not repeated here.
gombit:
  metadata: 1
  scaffold: 1
