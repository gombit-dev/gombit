# pnpm 11 and later run a dependency's build script (esbuild's postinstall)
# only when this file approves it. Without it, `pnpm install` in this
# directory fails with ERR_PNPM_IGNORED_BUILDS. npm runs the script without
# approval, and gombit prefers npm when no frontend/pnpm-lock.yaml exists.
allowBuilds:
  esbuild: true
