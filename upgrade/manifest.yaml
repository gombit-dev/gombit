  - version: unreleased
    changes:
      - id: frontend-pnpm-esbuild-approval
        kind: manual
        area: scaffold
        summary: "A scaffolded app approves esbuild's build script for pnpm in `frontend/pnpm-workspace.yaml`; an app scaffolded before has no such file, so `pnpm install` fails there."
        details: |
          With pnpm 11 or later, `pnpm install` in `frontend/` fails with
          `ERR_PNPM_IGNORED_BUILDS` until esbuild's build script is approved.
          If `frontend/pnpm-workspace.yaml` is missing, create it with both
          the `packages` entry required by pnpm 9 and the esbuild approval:

          ```yaml
          packages:
            - .

          allowBuilds:
            esbuild: true
          ```

          If pnpm already wrote that file with a placeholder
          (`esbuild: set this to true or false`), change the placeholder to
          `true`. An app that runs npm needs no change. pnpm 10.26 and later
          also honors `allowBuilds`; older pnpm 10 may warn that the build
          script was ignored, but esbuild's optional platform package lets
          the install succeed. Then run `gombit dev` or `gombit build --embed`
          again.
        refs: [509]

      - id: frontend-npm-before-pnpm
        kind: informational
        area: behavior
        summary: "`gombit dev` and `gombit build --embed` run `npm` unless `frontend/pnpm-lock.yaml` exists; `pnpm` runs only when `npm` is absent."
        details: |
          An app that has both tools and no `frontend/pnpm-lock.yaml` now runs
          `npm` where it ran `pnpm`. An app with a `pnpm-lock.yaml` still runs
          `pnpm`.
        refs: [509]

      - id: dev-http-addr-normalised
        kind: informational
        area: cli
        summary: "`gombit dev --http` validates the address it hands the backend: a bare port (`8080`) reaches `GOMBIT_HTTP_ADDR` as `:8080`, and a port outside 1–65535 is refused before anything starts."
        details: |
          The check normalised only for itself and the child environment got
          the raw flag, so the service table advertised
          `http://127.0.0.1:8080` while the backend died on `listen tcp:
          address 8080: missing port in address`, and `gombit dev` kept
          running with only Vite up. `:0`, `:-1` and `:99999` are refused now
          instead of failing the same way mid-run. An address already in
          `host:port` form is untouched. A value dev had to rewrite is printed
          on stderr with both forms, naming no file: it reports the rewrite,
          not where the value came from, and `--http 8080` is the documented
          shorthand that needs no change. What the notice does say is that only
          the child sees the rewrite, so a bare port written in the config is
          still read verbatim by `go run ./cmd/server`. An address that cannot
          be listened on is refused before anything starts, named by where it
          was read: `--http` when the flag is set, `GOMBIT_HTTP_ADDR` when
          configuration supplied it.
        refs: [513]
