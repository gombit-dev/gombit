# Gombit's compatibility manifest (docs/upgrade.md § The compatibility
# manifest): every upgrade-relevant change of each release, classified. The
# upgrade tooling plans from it, and the upgrade notes (docs/upgrade-notes.md,
# the GitHub release body) are rendered from it. Regenerate the notes with
#   go test ./upgrade -run TestUpgradeNotesDoc -update
#
# Every release from the first one covered is listed, even with no changes: an
# unlisted version has no known upgrade path. The next release's changes
# collect under `unreleased`, renamed to its version when it is cut
# (docs/releasing.md). Audit `git log vPREVIOUS..HEAD`, not only the
# CHANGELOG; TestChangelogIsDeclared checks that every issue the CHANGELOG's
# Unreleased section links is in some change's refs, or exempt with a reason.
#
# A change has:
#   id        kebab-case, unique across the manifest
#   kind      automatic (the tooling applies it: names an `action`),
#             manual (the developer acts: `details` says how), or
#             informational (nothing to do, worth knowing)
#   breaking  whether an app that relies on documented (or reasonably
#             relied-on) behavior can stop building, starting or working
#             until it acts; a fix only code matching undocumented output
#             notices is not breaking
#   area      api, behavior, cli, client, config, dependency, scaffold, schema
#             or security
#   summary   one line; details: Markdown; refs: issue/PR numbers
#   schema    (area schema) the framework-owned tables it adds, alters or
#             removes: {model: auth.RefreshToken, table: refresh_tokens,
#             change: altered}; a join table a model declares says
#             join: true, a change that loses data destructive: true;
#             TestFrameworkSchemaIsDeclared holds the framework's models
#             to them (docs/upgrade.md)
#   deprecates  the framework APIs it deprecates, as gombit upgrade check
#             names them (database.KeepStoredZeros): a "Deprecated: since
#             vX.Y.Z" paragraph must name the release that declares it
format: 1
releases:
  - version: v0.6.1
    # The first release the manifest covers: upgrades are described from here.

  - version: v0.7.0
    changes:
      - id: admin-composite-primary-keys
        kind: manual
        breaking: true
        area: api
        summary: "`admin.Register` refuses a model whose primary key spans several columns."
        details: |
          Such a model used to register, and the admin addressed its rows by
          the first key column alone. Startup now fails with `admin: <Model>
          has a composite primary key, which is not supported`. Give the
          model a single-column primary key, or keep it out of the admin
          registry.
        refs: [453]

      - id: stop-hook-shutdown-budget
        kind: manual
        area: behavior
        summary: "`OnStop` hooks get their own shutdown-timeout budget, so a full shutdown can take longer."
        details: |
          A shutdown can now take the drain delay plus up to twice the
          shutdown timeout (`framework.WithShutdownTimeout`, 10s by default).
          Check that the orchestrator's termination grace period (Kubernetes
          `terminationGracePeriodSeconds`, ECS `stopTimeout`) still covers
          it.
        refs: [431]

      - id: sanitize-html-stray-angle-bracket
        kind: informational
        area: security
        summary: "`framework.SanitizeHTML` keeps text after a stray `<` when the value also has a real tag."
        details: |
          That tail comes back as `SanitizeHTML` returns a value with no
          complete tag: raw, undecoded input. It is no safer than that case;
          escape on output as before.
        refs: [433]

      - id: admin-csp-allows-storage-origin
        kind: informational
        area: security
        summary: "The admin and embedded SPA pages' Content-Security-Policy allows the object store's origin for images and requests."
        details: |
          With a remote store (an S3 bucket, a CDN), its origin joins the
          policy's `img-src` and `connect-src`, so file previews and direct
          uploads work. Review it if the store's origin is shared with
          content you do not control.
        refs: [330]

      - id: request-timeout-response-reaches-client
        kind: informational
        area: behavior
        summary: "With `GOMBIT_HTTP_REQUEST_TIMEOUT` set, the 504 a timed-out handler writes reaches the client; `WriteTimeout` is the request timeout plus 5s."
        refs: [430]

      - id: panicking-requests-in-metrics
        kind: informational
        area: behavior
        summary: "Requests whose handler panics are counted in `gombit_http_requests_total` (as 500, or the status already sent)."
        refs: [432]

      - id: embedded-html-browser-policy
        kind: informational
        area: security
        summary: "Every HTML document of an embedded frontend gets the SPA browser security policy, not only the root `index.html`."
        refs: [434]

      - id: app-runs-once
        kind: manual
        breaking: true
        area: api
        summary: "A `framework.App` runs once: every return from `Run`, `RunContext` or `RunWorker` runs the stop hooks and closes what the app opened."
        details: |
          That includes the returns before serving (a listener that cannot
          bind, refused worker options). Code that retried `RunContext` with
          the same `*App` after such an error now runs against a closed cache
          and job dispatcher: build a new `App` (`framework.New`) to retry.
        refs: [435]

      - id: trusted-proxies-trust-all
        kind: manual
        breaking: true
        area: security
        summary: "Production refuses `GOMBIT_HTTP_TRUSTED_PROXIES` values that trust every peer: a zero-length prefix in any spelling, or ranges that together cover all addresses."
        details: |
          `10.0.0.0/0`, `::0/0` or `0.0.0.0/1,128.0.0.0/1` used to start;
          `Config.Validate` now refuses them in production, since trusting
          every peer lets any client spoof its forwarded IP. List only the
          addresses of the proxies you control.
        refs: [500]
        config:
          - {var: GOMBIT_HTTP_TRUSTED_PROXIES, change: refused, environment: production}

      - id: jobs-crash-redelivery-max-attempts
        kind: informational
        area: behavior
        summary: "A job whose worker died mid-attempt is no longer redelivered past `MaxAttempts`: it moves to the failed jobs as exhausted."
        details: |
          An attempt interrupted by `Release` or worker shutdown may still run
          once more past `MaxAttempts`, as before.
        refs: [494]

      - id: jobs-retry-all-once
        kind: informational
        area: cli
        summary: "`gombit jobs retry --all` retries each failed job at most once per invocation."
        details: |
          A job that fails again while the command runs is left for the next
          invocation, instead of being retried until the command times out.
        refs: [493]

      - id: database-driver-updates
        kind: informational
        area: dependency
        summary: "The framework requires newer database drivers: `github.com/go-sql-driver/mysql` v1.10.1 and `github.com/mattn/go-sqlite3` v1.14.52."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade. The framework also newly requires the AWS SDK
          for Go v2 (the S3 storage driver) and `golang.org/x/sys` directly.
        refs: [536, 540]

      - id: object-storage
        kind: informational
        area: schema
        summary: "Object storage (`app.Storage()`, `GOMBIT_STORAGE_*`) and storage-backed `file` / `image` model fields."
        details: |
          File fields record ownership in a framework table, `storage_claims`,
          which new apps' migrations create. An existing app that adopts file
          fields adds the table to its migrations (`claims.Models()`; see
          docs/storage.md, "Setup").
        schema:
          - {model: storage/claims.Claim, table: storage_claims, change: added}
        refs: [279, 323, 324, 325, 326, 327, 328, 329, 530]

  - version: v0.7.1
    changes:
      - id: d10-not-found-and-panics
        kind: informational
        area: behavior
        summary: "Unknown paths and recovered panics answer with the D10 error envelope (`not_found` 404, `internal` 500)."
        details: |
          A 404 used to be Gin's plain-text body (or empty under an embedded
          frontend) and a panic an empty 500. A client matching those bodies
          sees JSON now; the documented error contract was already D10, so
          this is not marked breaking.
        refs: [438]

      - id: unencodable-response-500
        kind: informational
        area: behavior
        summary: "A response that cannot be encoded as JSON is a D10 500 instead of a 200 with a plain-text body."
        refs: [442]

      - id: memory-cache-increment-overflow
        kind: informational
        area: behavior
        summary: "The in-memory cache's `Increment` refuses to overflow, and a stored `nil`, as Redis does."
        refs: [437]

      - id: cache-janitor-non-positive
        kind: informational
        area: behavior
        summary: "`cache.WithJanitor` with a zero or negative interval means no janitor, instead of crashing the process."
        refs: [436]

      - id: decimals-never-changed-on-write
        kind: manual
        breaking: true
        area: behavior
        summary: "A decimal is never stored changed: a value that does not fit its column's `decimal(p,s)` (or, on SQLite, has more than 15 digits) is a 422 instead of being rounded."
        details: |
          A decimal field whose column type is neither decimal nor text
          (`type:real`, `type:double precision`, `type:money`, `type:bigint`)
          now fails every write: declare it `decimal(p,s)`. A string written to
          a text decimal column must be the canonical spelling (`"1.5"`, not
          `"1.50"`). The generated create handler now responds with the stored
          row: run `gombit generate` to pick that up in an existing app.
        refs: [440]

      - id: timestamps-in-storable-range
        kind: manual
        breaking: true
        area: behavior
        summary: "Every write refuses a timestamp or date no supported driver can store and return (outside 1000..9999), with a 422 on that field."
        details: |
          That includes a zero `time.Time` a write sets (a non-pointer field
          left unset on create, a zero in a map or `Update`): it was stored on
          SQLite and PostgreSQL and was a 500 on MySQL. Use a pointer for an
          optional time. Rows that already store the zero instant stay editable
          through `Update`, a partial `Updates` and the admin; a generic `Save`
          of one is a 422 until the column is cleaned up (docs/database.md).
        refs: [443]

      - id: database-logging-through-app-logger
        kind: informational
        area: security
        summary: "Database logging goes through the app's logger, at its level and sink, and never carries parameter values."
        details: |
          GORM's default logger wrote to stdout in its own format and inlined
          parameter values into failed statements (a password hash, an
          email). Statements and 4xx failures now log at `debug`, slow
          statements at `warn`, other failures at `error`. A GORM logger the
          app sets on its database is kept.
        refs: [439]

      - id: page-offset-saturates
        kind: informational
        area: behavior
        summary: "A list page so far out that its offset overflows is empty, instead of returning the first page's rows."
        refs: [441]

  - version: v0.8.0
    changes:
      - id: dotenv-long-lines
        kind: informational
        area: config
        summary: "`config.Load` reads a `.env` file whole: a line longer than 64 KiB no longer silently stops it, so the assignments after one now apply."
        details: |
          Before, the first line over 64 KiB ended the read without an
          error, and every variable after it kept its process-environment
          or default value. If a `.env` has such a line, check the values
          set after it.
      - id: admin-relation-string-keys
        kind: informational
        area: behavior
        summary: "An admin relation field on a string key stores the string sent, byte for byte; a JSON number for it is a 422."
        details: |
          A numeric-looking key (`"123"`, `"007"`) was stored corrupted. A
          client that sends a string key as a JSON number now gets a 422 on the
          field, as for any string field: send it as a string. A uuid key must
          be the canonical form, as a `uuid` field (no braces, with hyphens).
          An integer key still accepts a number or its digits as a string.
        refs: [452]

      - id: admin-patch-writes-changes-only
        kind: informational
        area: behavior
        summary: "An admin PATCH writes only the columns it (or a model hook) changed, never associations, and answers 404 for a row deleted meanwhile."
        details: |
          It used to save the whole loaded row: a concurrent change to another
          column was reverted, a deleted row came back, and `has_many`
          children were written back. `database.ScopeEdit` now narrows any
          `Select("*")` update of the scoped row the same way.
        refs: [450]

      - id: floats-must-be-finite
        kind: manual
        breaking: true
        area: behavior
        summary: "Every write refuses a float that is not finite (`+Inf`, `-Inf`, `NaN`), or beyond a `float32` field's range, with a 422 on that field."
        details: |
          It was stored on PostgreSQL and SQLite (and a 500 on MySQL). Code
          that stored a non-finite float on purpose in a column it never
          returns as JSON now gets a `*database.ValidationError`: store NULL
          (a pointer or `sql.NullFloat64`) instead. A row that already stores
          one keeps working for partial updates of other columns and for an
          admin edit that leaves the column alone, but a generic `Save` of it
          is a 422 on that field until the column is set to a finite value or
          NULL (docs/database.md § Floats).
        refs: [449]

      - id: reserved-upgrade-command
        kind: manual
        breaking: true
        area: cli
        summary: "`upgrade` is a framework command, and a reserved management-command name."
        details: |
          An app that registers its own `upgrade` command loses it: the
          framework's is added first, and Cobra resolves to it. Rename the
          app's command (and its `internal/<pkg>/commands.go` registration).
        refs: [341]

      - id: record-upgrade-baseline
        kind: automatic
        action: record-baseline
        area: scaffold
        summary: "`gombit new` records the app's upgrade baseline in a `gombit:` block of `gombit.yaml`."
        details: |
          An app generated before records none, and is detected as scaffold
          version 0. `gombit upgrade baseline --write` records it.
        refs: [341]

      - id: contract-app-fork-unresolved
        kind: manual
        breaking: true
        area: cli
        summary: "`gombit contract app` refuses a framework replaced by a fork, and a `go.mod` the go command refuses."
        details: |
          A `replace` of `github.com/gombit-dev/gombit` by another module used
          to report the fork's version as the framework's; it is now
          unresolved, like a local path. A `go.mod` requiring the framework
          twice, or replacing it twice with different targets, is an error.
          The replace that counts is the one the go command applies to the
          required version (an exact-version replace over an every-version
          one; a replace of another version does not apply), so a go.mod
          carrying several replaces can report a different version, or
          resolve where it used to fail. Build the contract against a
          framework release.
        refs: [341]

      - id: make-resource-windows-posix-rename
        kind: informational
        area: cli
        summary: "On Windows, `gombit make resource` replaces files with a POSIX-semantics rename, so a file open with delete sharing no longer blocks it."
        details: |
          On a volume that refuses that rename (FAT or exFAT, a network share
          or mapped drive, a `\\wsl$` path, or Windows before 10 1709) it keeps
          its previous plain rename and its rollback.
        refs: [341]

      - id: text-storable-on-every-driver
        kind: manual
        breaking: true
        area: behavior
        summary: "Every write refuses text a column cannot store the same way on every driver (a NUL byte, invalid UTF-8, more than the column holds), with a 422 on that field."
        details: |
          It was a 500 on PostgreSQL or MySQL and stored on SQLite. A
          `size:n` / `varchar(n)` column holds n characters, a `text` column
          65,535 bytes (MySQL's `TEXT`), and an unsized primary-key, indexed,
          unique or defaulted string 191 characters (MySQL's `varchar(191)`),
          now on every driver: PostgreSQL and SQLite stored more. A row that
          already stores such text stays editable through the admin, its form
          included, and partial updates (`database.ScopeEdit` with
          `database.StoredValues` judges only what an edit changes); a generic
          `Save` of it is a 422 on that field until the value is shortened or
          cleaned (docs/database.md § Text).
        refs: [444]

      - id: database-search-takes-context
        kind: manual
        breaking: true
        area: api
        summary: "`database.Search` takes a context and returns an error, like `FilterEq`: a search term with a NUL byte or invalid UTF-8 is a 422."
        details: |
          Code calling `database.Search(q, columns, term)` no longer builds:
          call `database.Search(ctx, q, columns, term)` and return its error.
          Run `gombit generate` to update an app's generated `handler.gen.go`,
          which also answers a `get` of an id over `MaxInt64` with a 404.
        refs: [444]

      - id: scaffolded-get-id-over-maxint64
        kind: manual
        area: scaffold
        summary: "A scaffolded `internal/product/handler.go` answers an id over `MaxInt64` with a 404; an app scaffolded before answers a 500 on PostgreSQL."
        details: |
          The handler is app-owned, so `gombit generate` does not update it. In
          its `get`, parse the id with `strconv.ParseUint(input.ID, 10, 63)`
          instead of `64`: PostgreSQL's bigint cannot bind a larger id, and no
          row holds one. Apply the same to any hand-written handler that
          parses a uint id.
        refs: [444]

      - id: keep-stored-zeros-deprecated
        kind: informational
        area: api
        summary: "`database.KeepStoredZeros` is deprecated: use `database.ScopeEdit` with `database.StoredValues`."
        details: |
          `ScopeEdit` judges an edit of a loaded row on what it changes,
          compared after the model's hooks, for the text check as well as
          stored zero instants. `KeepStoredZeros` keeps working.
        refs: [444]
        deprecates: [database.KeepStoredZeros]

      - id: data-exceptions-are-422
        kind: informational
        area: behavior
        summary: "`MapPersistError` and `MapLoadError` answer a database data exception (a value too long or out of range for its column) with a 422 instead of a 500."
        details: |
          PostgreSQL 22001, 22003, 22007, 22008, 22021, 22P05 and MySQL 1264,
          1265, 1292, 1366, 1406 (`database.IsDataException`). A uint list
          filter over `MaxInt64` is a 422 too.
        refs: [444]

      - id: auth-session-management
        kind: informational
        area: api
        summary: "Session management in both auth modes: `GET {prefix}/auth/sessions` lists the user's active sessions; `DELETE {prefix}/auth/sessions/{id}` and `DELETE {prefix}/auth/sessions?scope=others|all` revoke them."
        details: |
          `auth.Service` gains `ListSessions` (returning `[]auth.AuthSession`),
          `RevokeSession`, `RevokeAllSessions` and `ErrSessionNotFound`. Cookie
          mode clears the session cookies when a request ends its own session
          (docs/auth.md § Sessions).
        refs: [335]

      - id: auth-session-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers the session routes, the `auth-*` session operation IDs or the `AuthSession` / `AuthRevokeResult` schema names fails at startup: the framework registers them."
        details: |
          With `GOMBIT_JWT_SECRET` set, registering a route at `GET` or
          `DELETE {prefix}/auth/sessions` or `DELETE {prefix}/auth/sessions/{id}`
          (through Huma or the raw Gin router), an operation
          `auth-list-sessions`, `auth-revoke-session` or `auth-revoke-sessions`,
          or a type Huma names `AuthSession`, `DataListAuthSession`,
          `AuthRevokeResult` or `DataAuthRevokeResult` now panics when the app
          starts. Drop the app's own session routes, which the framework's
          replace, or rename them. A resource named `Session`
          (`gombit make resource Session`) does not collide.
        refs: [335]

      - id: refresh-reuse-only-rotated-tokens
        kind: informational
        area: security
        summary: "A refresh token revoked by logout or session revocation is a 401 that no longer revokes the user's other sessions; only an already-rotated token counts as reuse."
        refs: [335]

      - id: refresh-ttl-at-least-access-ttl
        kind: manual
        breaking: true
        area: config
        summary: "With auth enabled, a `GOMBIT_JWT_REFRESH_TTL` shorter than `GOMBIT_JWT_ACCESS_TTL` fails config validation, so the app does not start."
        details: |
          The refresh token's lifetime is the session's, and an access token
          must not outlive its session: it would stop authenticating when the
          session ends while its `exp`, `expires_in` and access cookie still
          promised more. Config validation (`config.Load` / `Validate`) and
          `auth.NewService` refuse that pair; equal TTLs are fine. Raise
          `GOMBIT_JWT_REFRESH_TTL` to at least `GOMBIT_JWT_ACCESS_TTL`, or
          lower `GOMBIT_JWT_ACCESS_TTL`. An access token also ends with its
          session: it stops authenticating when the session expires, not only
          when it is revoked, so a token issued before the upgrade under the
          old TTLs stops at its session's expiry, before its `exp`.
        config:
          - {var: GOMBIT_JWT_REFRESH_TTL, change: refused}
          - {var: GOMBIT_JWT_ACCESS_TTL, change: refused}
        refs: [335]

      - id: refresh-lock-failure-is-500
        kind: informational
        area: behavior
        summary: "`POST /auth/refresh` answers 500, not 401, when the database fails while the rotation locks the user's row (a deadlock, a lock timeout, a lost connection)."
        details: |
          Only a user that no longer exists is a 401 there, so a client can
          retry instead of treating the failure as a dead credential.
        refs: [335]

      - id: auth-user-row-lock
        kind: informational
        area: behavior
        summary: "Refresh-token rotation and the session revocations lock the user's row for their transaction (`FOR NO KEY UPDATE` on PostgreSQL, `FOR UPDATE` on MySQL), so they run one at a time per user."
        details: |
          Application code that holds a lock on a user's row in a long
          transaction now delays that user's refreshes and revocations. Code
          that also writes a user's refresh tokens should lock the user's row
          first, as the framework does.
        refs: [335]

      - id: refresh-reuse-cascade-takes-user-lock
        kind: informational
        area: security
        summary: "The refresh-token reuse cascade takes the user's row lock, like rotation, so it also revokes the token a concurrent rotation of another of the user's sessions issues."
        details: |
          On PostgreSQL that token could survive the cascade.
        refs: [335]

      - id: client-schema-session-operations
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the session operations; an existing app's generated client gets them from `gombit client generate`."
        refs: [335]

      - id: aws-sdk-updates
        kind: informational
        area: dependency
        summary: "The framework requires newer AWS SDK for Go v2 modules (the S3 storage driver): `github.com/aws/aws-sdk-go-v2` v1.47.3, `github.com/aws/aws-sdk-go-v2/service/s3` v1.114.0 and `github.com/aws/smithy-go` v1.28.5."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade.
        refs: [570, 590]

  - version: v0.9.0
    changes:
      - id: date-driver-location
        kind: manual
        area: behavior
        summary: "`types.Date` keeps its calendar day whatever the driver's time zone, except, with `parseTime=true`, a day a MySQL `loc` skipped whole; dates a location west of UTC already moved stay moved."
        details: |
          Only an app whose DSN sets a location other than UTC is affected:
          SQLite `_loc` (or `_loc=auto` on such a machine) or MySQL `loc`. The
          default DSNs set none, and PostgreSQL was not affected. West of UTC,
          every date written through MySQL was stored a day early; on SQLite a
          date was stored right but read a day early, so code that wrote back a
          row it had read (`Save`, or `Updates` of the loaded struct) stored
          that earlier day; the admin writes only the fields an edit changes.
          Each later save moved it one more day, so no single `UPDATE` repairs a
          table: check those columns against another source before correcting
          them. From this release they read back as stored, which on SQLite is
          one day later than they read before, with one exception. With
          `parseTime=true` (as the DSN `gombit new` writes) and a MySQL `loc`
          that skipped a whole calendar day, such as Pacific/Apia on 2011-12-30,
          go-sql-driver/mysql returns that day as the same time as the day
          before, so it reads as the day before, as it did before this release,
          and saving a row read so stores the day before. It is stored right
          when written; with `parseTime=false` the driver returns the text, and
          that day reads back right. With a MySQL `loc` whose offset from UTC on
          the compared date is not zero, a `types.Date` compared with a column
          that is not DATE (DATETIME, TIMESTAMP or text) now means the
          `YYYY-MM-DD` text, midnight, where it meant UTC midnight converted to
          `loc` (for TIMESTAMP, MySQL reads it in the session's `time_zone`):
          check such conditions, or pass `d.Time()` to keep the old comparison.
          A `types.Date` passed to `database/sql` directly, not through GORM, is
          still sent in MySQL's `loc`: pass `d.String()` instead.
        refs: [478]

      - id: refresh-follower-not-cancelled-by-leader
        kind: informational
        area: behavior
        summary: "A refresh that joins another request's rotation of the same token no longer fails with that request's `context canceled` (a 500) when its client disconnects: the shared rotation runs detached from every caller's cancellation and deadline, its transaction bounded by a 10-second timeout."
        details: |
          A rotation whose first caller disconnects or passes its request
          deadline now finishes (or times out) for every caller that joined
          it, the first included, instead of being cancelled with that
          caller's request. The trade: the rotation commits although that
          first client is gone and never receives the new pair, so its retry
          with the old token is a plain 401 within
          `GOMBIT_AUTH_REFRESH_REUSE_GRACE` while the new session is live,
          and reuse (every session revoked) after it; and a timeout
          or an `auth.Service.Close` that lands after COMMIT was sent can
          still report failure for an applied rotation. After `Close`, a
          rotation in flight is cancelled and later ones fail at once.
          A Go caller of `auth.Service.RotateRefresh` waits for the shared
          rotation instead of returning when its context is done.
        refs: [462]

      - id: createsuperuser-login-rules
        kind: manual
        breaking: true
        area: api
        summary: "`gombit createsuperuser`, `auth.Service.CreateSuperuser` and `Register` refuse an email that is not a bare address and a password shorter than 8 characters (or over 72 bytes)."
        details: |
          Two rules, for two reasons. The email must be what `POST
          /auth/login` accepts: an account with `admin` could never sign in.
          The password must meet the policy a user's own password meets on
          register, change and reset: an account with a shorter one could
          sign in, so this is a tightening. A seed script or app code that
          creates an account with `--email admin`, or a password under 8
          characters, fails after the upgrade: give it a real address and a
          password of at least 8 characters. `auth.CheckNewAccount` reports
          both without a database (`auth.ErrInvalidEmail`, an
          `auth.PasswordPolicyError`). Existing accounts are not touched:
          one whose email is not an address still cannot sign in (delete
          it and create it again); one with a short password keeps working
          until the password is changed.
        refs: [461]

      - id: auth-database-failure-is-500
        kind: informational
        area: api
        summary: "A database failure during login, or while the auth gate loads the access token's user or session, is a 500 (`internal`), no longer a 401."
        details: |
          Only a missing user or session row is a 401; the session stays valid
          through the outage, and no failed login is audited for it. A client
          signs out only if it treats a 5xx as one, and the SPAs this repo
          ships still do: the scaffold's failed refresh (#580), and the
          scaffold's and the admin's `RequireAuth` on a failed `/me` and the
          admin's failed refresh, which #580 does not cover yet.
          `auth.ErrInvalidCredentials` and `auth.ErrInvalidAccessToken` are
          now exported: an app's own login or gate built on `Authenticate` /
          `ParseAccess` answers 401 only for them.
        refs: [460]

      - id: refresh-reuse-grace
        kind: manual
        area: security
        summary: "A refresh with a token rotated less than `GOMBIT_AUTH_REFRESH_REUSE_GRACE` (30 seconds by default) ago, whose successor is still live, is a plain 401, audited as `auth.refresh.reuse_within_grace`, no longer reuse that revokes every session of the user."
        details: |
          Two tabs sharing one refresh token no longer sign each other out
          when their refreshes arrive a round trip apart. The reuse cascade
          still runs for a rotated token presented after the grace, or whose
          successor was rotated again, before it expires; within it nothing is
          issued for the old token. Set `GOMBIT_AUTH_REFRESH_REUSE_GRACE=0`
          to keep the strict rule (an app with no clients sharing a refresh
          token across tabs). An audit consumer sees the new
          `auth.refresh.reuse_within_grace` action, whose target is the
          successor's session and whose details say whether it was live. The
          cost: if a thief rotates a stolen token first and the legitimate
          client's refresh lands within the grace, the client gets a 401 and
          the thief's session is not revoked; that event names it, by the
          session id of the moment (it changes when the session next
          refreshes, so act on it promptly).
        config:
          - {var: GOMBIT_AUTH_REFRESH_REUSE_GRACE, change: added}
        refs: [459]

      - id: admin-uuid-case-insensitive
        kind: informational
        area: behavior
        summary: "The admin reads a value for a `uuid.UUID` field (a path id, a filter, a belongs_to or many-to-many key, a written value) as `uuid.Parse` does and uses its canonical lower case, so an upper-case UUID finds its row on every driver."
        details: |
          Braced, `urn:uuid:` and unhyphenated spellings are accepted for such
          a field too, where they were a 422. A Go `string` field declared
          `Type: admin.TypeUUID` keeps the hyphenated form only and the
          spelling sent, written and compared, so rows it holds are found as
          before. One difference: a PATCH that sends such a key in a spelling
          other than the stored one is now refused as a key change (422 `id:
          cannot be changed`), where it was ignored, since on SQLite and in a
          PostgreSQL text column that spelling names no row; on MySQL and a
          native PostgreSQL `uuid` column, send the key as it was read, or
          leave it out.
        refs: [457]

      - id: constraint-errors-by-driver-code
        kind: informational
        area: behavior
        summary: "`database.IsUniqueViolation`, `IsForeignKeyViolation` and `IsNotNullViolation` classify a driver error by its code, not by words in its message, so an error naming a `unique_code` column is no longer a 409 conflict."
        details: |
          A NOT NULL violation on a column named `unique_code` was a `409
          conflict`; it is the `422` "missing a required value" now. An error
          that carries no PostgreSQL, MySQL or SQLite driver error is matched
          by the fixed wording of gorm's sentinels and the drivers' messages
          (`duplicated key not allowed`, `UNIQUE constraint failed`,
          `violates unique constraint`, `Duplicate entry`), no longer by the
          bare words `unique` or `duplicate`. MySQL 1364 (`Field ... doesn't
          have a default value`) is a `422` now, where it was a `500`.
        refs: [456]

      - id: bearer-handler-401-challenge
        kind: informational
        area: api
        summary: "Bearer-mode session revocation errors include the `WWW-Authenticate: Bearer realm=\"api\"` challenge when the handler returns 401."
        details: |
          Cookie-mode 401 responses still omit a Bearer challenge.
        refs: [604]

      - id: verification-resend-rate-limit-contract
        kind: informational
        area: api
        summary: "The email-verification resend operation's OpenAPI contract declares its 429 response and integer `Retry-After` header."
        refs: [611]

      - id: resource-operation-id-collision
        kind: informational
        area: cli
        summary: "`gombit make resource` refuses a name whose generated operation IDs the framework already registers, such as `Me`, whose `get-me` collides with auth's."
        details: |
          The scaffolded app used to build and then panic at boot on Huma's
          `duplicate operation ID`. Run `gombit make resource` under a
          different name; nothing is written when the name is refused.
        refs: [579]

      - id: go-1-26-9
        kind: informational
        area: dependency
        summary: "The framework requires Go 1.26.9 (`go 1.26.9` in go.mod), and `gombit new` pins it."
        details: |
          An app's `go` line is raised to 1.26.9 by `go get` or `go mod tidy`
          when it moves to this release. With the default `GOTOOLCHAIN=auto`
          the go command downloads that toolchain; with `GOTOOLCHAIN=local`,
          or in a build image, install Go 1.26.9 or later first.
        refs: [602]

      - id: admin-integers-must-fit
        kind: informational
        area: behavior
        summary: "Admin writes refuse an integer the field's Go type cannot hold, and a JSON number from 2^53 on, with a 422 on that field."
        details: |
          They were stored wrapped (`300` into an `int8` became `44`; `-5` into
          a `uint` made the list endpoint a 500). A client that sends a large
          integer sends it as a string (`"9007199254740993"`), which is read
          exactly.
        refs: [448]

      - id: list-order-primary-key-tiebreaker
        kind: informational
        area: behavior
        summary: "List endpoints end on the primary key: the admin list orders by it by default, and admin and generated lists break `?ordering=` ties with it, in the requested direction (`database.Ordering` appends its `fallback`)."
        details: |
          Pages of a list without a requested ordering, or with ties in the
          requested column, had no defined order on PostgreSQL and MySQL, so a
          row could appear on two pages or on none. A client that relied on
          the admin list's unordered (on SQLite, insertion) order sees the
          same rows in primary-key order. Generated list handlers now name
          the model's primary-key column instead of a literal `id`: `gombit
          generate` (or `gombit upgrade contract --write`) regenerates them,
          and a model keyed by another column gets a working list.
        refs: [455]

      - id: email-verification-schema
        kind: manual
        breaking: true
        area: schema
        summary: "Email verification adds `users.email_verified_at` and `users.verified_email`, and a table, `auth_one_time_tokens`, which registration and `gombit createsuperuser` write: an app migrates before it runs this release."
        details: |
          `auth.User` gains `EmailVerifiedAt` and `VerifiedEmail` (the
          address the verification is for), and the new framework model
          `auth.OneTimeToken` holds the hashed, single-use tokens the account
          lifecycle mails. Until the database has both, registering a user and
          `gombit createsuperuser` fail. Add `&auth.OneTimeToken{}` to the
          app's `AutoMigrate` (`internal/platform/database.go`), then generate
          and apply the migration (`gombit db makemigrations --model
          github.com/gombit-dev/gombit/auth.OneTimeToken`, `gombit db
          migrate`); `gombit upgrade --dry-run` lists the steps. Existing users
          start unverified; mark the ones you trust by setting
          `email_verified_at` and `verified_email` (to the user's `email`)
          yourself.
        schema:
          - {model: auth.User, table: users, change: altered}
          - {model: auth.OneTimeToken, table: auth_one_time_tokens, change: added}
        refs: [331]

      - id: email-verification-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers the email verification routes, their `auth-*` operation IDs or the `AuthVerifyEmailBody` / `AuthVerificationResult` schema names fails at startup: the framework registers them."
        details: |
          With `GOMBIT_JWT_SECRET` set, registering `POST
          {prefix}/auth/verify-email` or `POST {prefix}/auth/verify-email/resend`,
          an operation `auth-verify-email` or `auth-resend-email-verification`,
          or a type Huma names `AuthVerifyEmailBody`, `AuthVerificationResult`
          or `DataAuthVerificationResult` now panics when the app starts. Drop
          the app's own verification routes, which the framework's replace, or
          rename them.
        refs: [331]

      - id: email-verification
        kind: informational
        area: api
        summary: "Email verification: registration mails a single-use, expiring link (through `framework.WithAuthMailer`), `POST {prefix}/auth/verify-email` consumes it, `POST {prefix}/auth/verify-email/resend` sends a new one, and `auth.RequireVerifiedEmail` gates an app's own operations."
        details: |
          A production app with no mailer sends no message (registration still
          succeeds; a resend is a 503); development and test apps log each
          message instead. `GET /me` and registration report `email_verified`.
          `GOMBIT_AUTH_EMAIL_VERIFICATION_TTL` (24h) and
          `GOMBIT_AUTH_EMAIL_VERIFICATION_URL` configure the link.
        refs: [331]

      - id: client-schema-email-verified
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the verification operations and `PublicUser.email_verified`; an existing app's generated client gets them from `gombit client generate`."
        refs: [331]

      - id: client-unwrap-no-content
        kind: manual
        breaking: true
        area: client
        summary: "The generated client's `unwrap` resolves the success `openapi-fetch` reports, including a response with no body, instead of throwing `empty_response`; its result is now `T | undefined`, so a caller that reads a field off it has to narrow first."
        details: |
          A handler whose output struct has no `Body` answers 204, and every
          bodyless success — 204, a HEAD, a zero-length 2xx — reaches the
          wrapper as `data: undefined`, which it used to reject. `unwrap` now
          resolves that value and reads the status only to decide success: a
          non-2xx, or a result carrying an `error`, still throws the D10
          `ContractError`.

          The signature moves with it: `unwrap<T>(...)` is
          `Promise<T | undefined>`, because `undefined` is a value it resolves
          and a declaration that hid it told the caller to read a field of a
          response that had none. An app picks this up with
          `gombit client generate` (or `gombit client check --write`), then
          narrows wherever it consumes the result: a list page reads
          `listed && Array.isArray(listed.data) ? listed.data : []` rather
          than `listed.data`, and code that promises a body — a token pair
          from a login, an upload grant — throws or bails on `undefined`
          before using it. A `catch` added to swallow `empty_response` around
          a no-content call can go; code that relied on that throw to notice
          a missing body has to check the field it expects instead.
        refs: [505]

      - id: audit-trail-schema
        kind: manual
        area: schema
        summary: "The security audit trail adds a table, `auth_audit_events`: migrate it, or the events are not recorded (each failure is logged, and the operation still succeeds)."
        details: |
          The new framework model `auth.AuditEvent` holds one row per
          security-sensitive operation. Add `&auth.AuditEvent{}` to the app's
          `AutoMigrate` (`internal/platform/database.go`), then generate and
          apply the migration (`gombit db makemigrations --model
          github.com/gombit-dev/gombit/auth.AuditEvent`, `gombit db
          migrate`); `gombit upgrade --dry-run` lists the steps. Until then,
          logins, registrations and the other recorded operations still work,
          and log a warning for each event they could not write.
        schema:
          - {model: auth.AuditEvent, table: auth_audit_events, change: added}
        refs: [337]

      - id: audit-trail
        kind: informational
        area: api
        summary: "A security audit trail: logins (succeeded and failed), logouts, registrations, superuser creation, refresh-token reuse, session revocations, email verification, group and permission grants, and admin writes each record who, what, when and which request, never a secret."
        details: |
          Events go to `auth_audit_events` (`auth.ListAuditEvents` reads
          them), or to the app's own `auth.Auditor`
          (`framework.WithAuthAuditor`), for the auth routes and the admin.
          `auth.CaptureRequestInfo` and `auth.RecordAuditEvent` record an
          app's own sensitive operations; `admin.Mount` takes auth options.
        refs: [337]

      - id: request-id-bounded
        kind: informational
        area: behavior
        summary: "An inbound `X-Request-Id` longer than 128 bytes, or holding a space or a control character, is replaced by a generated ID instead of being echoed, logged and stored as sent."
        details: |
          A caller that sends a valid ID (at most `contract.MaxRequestIDLength`
          bytes of visible ASCII: a UUID, a trace-style hex ID) sees it back
          unchanged, as before. Every consumer (response header, logs, error
          envelopes, the audit trail) carries the one accepted ID.
        refs: [337]

      - id: password-reset-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers the password reset routes, their `auth-*` operation IDs or the `AuthPasswordForgotBody` / `AuthPasswordResetBody` / `AuthPasswordResetRequested` / `AuthPasswordResetResult` schema names fails at startup: the framework registers them."
        details: |
          With `GOMBIT_JWT_SECRET` set, registering `POST
          {prefix}/auth/password/forgot` or `POST {prefix}/auth/password/reset`,
          an operation `auth-request-password-reset` or `auth-reset-password`,
          or a type Huma names `AuthPasswordForgotBody`,
          `AuthPasswordResetBody`, `AuthPasswordResetRequested`,
          `AuthPasswordResetResult`, `DataAuthPasswordResetRequested` or
          `DataAuthPasswordResetResult` now panics when the app starts. Drop
          the app's own reset routes, which the framework's replace, or rename
          them.
        refs: [332]

      - id: password-reset
        kind: informational
        area: api
        summary: "Password reset: `POST {prefix}/auth/password/forgot` mails a single-use, expiring link and answers the same 202 whether or not the email is an account; `POST {prefix}/auth/password/reset` sets the new password and revokes every session of the user."
        details: |
          `GOMBIT_AUTH_PASSWORD_RESET_TTL` (1h) and
          `GOMBIT_AUTH_PASSWORD_RESET_URL` configure the link;
          `GOMBIT_AUTH_PASSWORD_RESET_KEEP_SESSIONS=true` keeps the sessions.
          `auth.Service.RequestPasswordReset` and `ResetPassword` are the same
          flow for an app's own code; `ResetPassword` enforces the password
          policy itself (at least 8 characters, at most 72 bytes, a
          `auth.PasswordPolicyError` on `password`), whatever its caller
          validated. A production app with no mailer sends
          no message. The messages are sent by the auth Service's bounded
          background workers (a request they cannot admit is a 503);
          `framework.App` closes the Service when it stops. A login now starts
          its session under the user's row lock (`auth.Service.Login`).
        refs: [332]

      - id: issue-tokens-checks-password-snapshot
        kind: manual
        breaking: true
        area: api
        summary: "`auth.Service.IssueTokens(ctx, user)` refuses (invalid credentials) a `user` whose `PasswordHash` is not the stored one: a snapshot from before a password change, or a `User` built by hand without it."
        details: |
          Pass the `User` that `Authenticate` returned, or one loaded from the
          database with its `PasswordHash`. A session then starts only if that
          password is still the user's, so a password reset committing between
          `Authenticate` and `IssueTokens` leaves the old password unable to
          start one. `auth.Service.Login` does both steps. A `User{ID: id}` built
          by hand, which used to start a session, now fails: load the user.
        refs: [332]

      - id: auth-mount-returns-service
        kind: manual
        breaking: true
        area: api
        summary: "`auth.Mount` returns the `*auth.Service` it builds; an app that calls it directly keeps it and closes it on shutdown."
        details: |
          `err := auth.Mount(api, db, cfg)` no longer compiles: write `svc,
          err := auth.Mount(api, db, cfg)`, and call `svc.Close(ctx)` when the
          app stops, before it closes the database. The Service runs
          background work (password reset messages) that Close drains, then
          cancels; a Service nobody closes leaves that work running against a
          closed database. With auth disabled, Mount returns a nil Service.
          An app on `framework.App` does not call `auth.Mount` and changes
          nothing.
        refs: [332]

      - id: client-schema-password-reset
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the password reset operations (and the forgot route's 503 with `Retry-After`); an existing app's generated client gets them from `gombit client generate`."
        refs: [332]

      - id: password-change-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers `POST {prefix}/auth/password/change`, an `auth-change-password` operation, or the `AuthPasswordChangeBody` / `AuthPasswordChangeResult` schema names fails at startup: the framework registers them."
        details: |
          Drop the app's own password-change route, which the framework's
          replaces, or rename it; the same goes for a type Huma names
          `AuthPasswordChangeBody`, `AuthPasswordChangeResult` or
          `DataAuthPasswordChangeResult`.
        refs: [333]

      - id: password-change
        kind: informational
        area: api
        summary: "Password change: `POST {prefix}/auth/password/change` sets a signed-in user's password given the current one, signs out their other sessions (unless `keep_other_sessions`), voids outstanding reset links, and is audited."
        details: |
          A wrong current password is a 422 on `current_password` and an
          `auth.password.change_failed` audit event; a change is
          `auth.password.changed`. `auth.Service.ChangePassword` is the same
          flow for an app's own code.
        refs: [333]

      - id: client-schema-password-change
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the password change operation; an existing app's generated client gets it from `gombit client generate`."
        refs: [333]

      - id: email-change-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers `POST {prefix}/auth/email/change` or `/auth/email/change/confirm`, the `auth-request-email-change` / `auth-confirm-email-change` operations, or the `AuthEmailChangeBody` / `AuthEmailChangeConfirmBody` / `AuthEmailChangeRequested` schema names fails at startup: the framework registers them."
        details: |
          Drop the app's own email-change routes, which the framework's
          replace, or rename them; the same goes for a type Huma names
          `AuthEmailChangeBody`, `AuthEmailChangeConfirmBody`,
          `AuthEmailChangeRequested` or `DataAuthEmailChangeRequested`.
        refs: [334]

      - id: email-change
        kind: informational
        area: api
        summary: "Email change: a signed-in user asks for a new address with their current password (`POST {prefix}/auth/email/change`), and it becomes the account's email, verified, only once the link mailed to it is confirmed (`POST {prefix}/auth/email/change/confirm`); the old address is notified."
        details: |
          Until the confirmation the account's email, and every link bound to
          it, is the old one; a link stops working once the account's email
          is no longer the one it was asked from, and an address another
          account took meanwhile is a 409. `GOMBIT_AUTH_EMAIL_CHANGE_URL` is
          the confirmation page (`{token}`); the link works as long as a
          verification link. `auth.Service.RequestEmailChange` and
          `ConfirmEmailChange` are the same flow for an app's own code.
        refs: [334]

      - id: client-schema-email-change
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the email change operations (and declares the forgot route's 422 and 500 responses); an existing app's generated client gets them from `gombit client generate`."
        refs: [334]

      - id: credential-throttles
        kind: manual
        area: security
        summary: "The credential endpoints are throttled by default: registrations, logins, password reset requests, one-time tokens, current-password checks and verification messages answer 429 with `Retry-After` past their limits."
        details: |
          Each rule counts one subject in a sliding window (docs/auth.md,
          "Abuse protection"): failed logins per email and client address
          (5 / 15 min), per address (100 / 15 min) and per email (100 / hour;
          an address that signed in to the account before is exempt),
          registrations and reset requests per address, invalid tokens per
          address, wrong
          current passwords and verification messages per user. Behind a
          proxy or load balancer, list it in `GOMBIT_HTTP_TRUSTED_PROXIES`:
          otherwise every client counts as the proxy's address. A client
          should honor `Retry-After`. A login or reset request now needs the
          account's exact email: on MySQL, a spelling the column's collation
          folds (a zero-width character, an accent) no longer signs in to
          the account. The counts live in the app's cache
          (`GOMBIT_CACHE_DRIVER=redis` shares them between instances).
          `auth.WithThrottlePolicy` changes the limits;
          `GOMBIT_AUTH_THROTTLE_DISABLED=true` turns them off.
        refs: [338]

      - id: cache-counter
        kind: informational
        area: api
        summary: "`cache.Counter`, `cache.IncrementTTL` and `cache.DecrementExisting`: an increment that gives a new counter an expiry, and a decrement only of a counter that exists, atomically (memory, Redis, noop and namespaced caches implement them; other caches get non-atomic fallbacks: an increment then a set, a decrement then a delete of a key it created)."
        refs: [338]

      - id: client-schema-throttle
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` declares the 429 (with `Retry-After`), 422 and 500 responses of the throttled auth operations; an existing app's generated client gets them from `gombit client generate`."
        refs: [338]

      - id: account-state-schema
        kind: manual
        breaking: true
        area: schema
        summary: "Account state adds `users.disabled_at`, which registration and `gombit createsuperuser` write: an app migrates before it runs this release."
        details: |
          `auth.User` gains `DisabledAt` (nil while the account is active).
          Until the column exists, registering a user and `gombit
          createsuperuser` fail (the insert names every column of the
          model), and so do disabling and enabling an account; reading a
          user works (a row read without the column is active). Generate and
          apply the migration (`gombit db makemigrations`, `gombit db
          migrate`) before deploying; `gombit upgrade --dry-run` lists the
          steps. Existing users start active.
        schema:
          - {model: auth.User, table: users, change: altered}
        refs: [336]

      - id: account-state-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers `POST {prefix}/auth/users/{id}/disable` or `/enable`, the `auth-disable-user` / `auth-enable-user` operations, or the `AuthUserState` schema name fails at startup: the framework registers them."
        details: |
          Drop the app's own routes, which the framework's replace, or
          rename them; the same goes for a type Huma names `AuthUserState`
          or `DataAuthUserState`.
        refs: [336]

      - id: account-state
        kind: informational
        area: security
        summary: "Accounts can be disabled: a disabled user cannot sign in, and no credential issued to it works (its sessions are revoked, its links voided, and every check refuses it)."
        details: |
          `POST {prefix}/auth/users/{id}/disable` and `/enable` require the
          `auth.users.manage` permission (`auth.PermissionManageUsers`; a
          superuser has it), and a superuser to change a superuser; no one
          disables their own account. `auth.Service.DisableUser` /
          `EnableUser` are the same for an app's own code. A login with the
          right password of a disabled account is a 403; a wrong password
          answers as before. `auth.HasPermission` / `HasPermissions` grant a
          disabled account nothing, a superuser's included, and decide on
          the stored user's row, reloaded, not on the `User` passed in: a
          superuser snapshot whose row was deleted, disabled or demoted
          since now gets nothing, and a stored superuser with a nil
          database is an error (`auth: nil database`) rather than every
          permission.
        refs: [336]

      - id: client-schema-account-state
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the account state operations; an existing app's generated client gets them from `gombit client generate`."
        refs: [336]

      - id: mfa-schema
        kind: manual
        breaking: true
        area: schema
        summary: "Multi-factor authentication adds two tables, `auth_totp_factors` and `auth_recovery_codes`, which every login of the framework's routes reads: an app migrates before it runs this release."
        details: |
          The new framework models `auth.TOTPFactor` (a user's TOTP
          authenticator, its secret encrypted) and `auth.RecoveryCode` (the
          single-use recovery codes, hashed). A login checks whether the
          account has MFA, so until the tables exist logins fail. Add
          `&auth.TOTPFactor{}` and `&auth.RecoveryCode{}` to the app's
          `AutoMigrate` (`internal/platform/database.go`), then generate and
          apply the migration (`gombit db makemigrations --model
          github.com/gombit-dev/gombit/auth.TOTPFactor --model
          github.com/gombit-dev/gombit/auth.RecoveryCode`, `gombit db
          migrate`); `gombit upgrade --dry-run` lists the steps.
        schema:
          - {model: auth.TOTPFactor, table: auth_totp_factors, change: added}
          - {model: auth.RecoveryCode, table: auth_recovery_codes, change: added}
        refs: [339]

      - id: mfa-names-reserved
        kind: manual
        breaking: true
        area: api
        summary: "With auth enabled, an app that registers `{prefix}/auth/mfa`, `/auth/mfa/totp`, `/auth/mfa/totp/confirm`, `/auth/mfa/recovery-codes`, `/auth/mfa/disable` or `/auth/users/{id}/mfa/reset`, their `auth-mfa-*` operations, or the `AuthMFAStatus` / `AuthTOTPEnrollBody` / `AuthTOTPEnrollment` / `AuthTOTPConfirmBody` / `AuthRecoveryCodes` / `AuthMFAProofBody` schema names fails at startup: the framework registers them."
        details: |
          Drop the app's own MFA routes, which the framework's replace, or
          rename them; the same goes for a type Huma names after one of those
          schemas (or their `Data…` envelopes).
        refs: [339]

      - id: mfa-totp
        kind: manual
        breaking: true
        area: security
        summary: "Multi-factor authentication: a user enrolls a TOTP authenticator (with recovery codes), and from then on a login needs `mfa_code` besides the password; an operator with `auth.users.manage` resets a user's MFA."
        details: |
          `POST {prefix}/auth/login` (both modes) takes an optional
          `mfa_code`: for an account with MFA, a login without it is a 422 on
          `mfa_code` ("required"), after the right password only, and a wrong
          one a 422 ("invalid"); the client asks for the code and logs in again
          with it (the admin's and a new app's login pages do; an app's own
          login page needs the same, or MFA users cannot sign in through it).
          Breaking for Go callers: `auth.Service.Authenticate` / `Login` now
          answer such an account `ErrMFARequired` (a client error, not a
          server one), and `ErrTooManyAttempts` can come from `MFAPerUser`;
          `AuthenticateMFA` / `LoginMFA` take the code. Any user can enroll:
          the routes are mounted with auth. Confirming an enrollment ends the
          user's other sessions. The TOTP secrets are encrypted and the recovery
          codes hashed under keys derived from `GOMBIT_AUTH_MFA_KEY`, or from
          `GOMBIT_JWT_SECRET` when it is unset: then rotating the JWT secret
          makes every enrolled authenticator unusable (logins of those
          accounts fail until an operator resets their MFA). Set
          `GOMBIT_AUTH_MFA_KEY` (at least 32 characters) to rotate them apart;
          setting it on an app whose users already enrolled has the same
          effect once.
        config:
          - {var: GOMBIT_AUTH_MFA_KEY, change: added}
        refs: [339]

      - id: client-schema-mfa
        kind: informational
        area: client
        summary: "A new app's placeholder `schema.ts` includes the MFA operations and the login's `mfa_code`; an existing app's generated client gets them from `gombit client generate`."
        refs: [339]

      - id: external-identity-schema
        kind: manual
        area: schema
        summary: "External identity adds the table `auth_identity_links`, which an app that registers an identity provider needs before it serves the external sign-in routes."
        details: |
          The new framework model `auth.IdentityLink` maps an identity at an
          external provider (provider, subject) to a local user. Only the
          external identity routes read it, and they are mounted only with a
          provider (`framework.WithAuthIdentityProviders`), so an app without
          one can leave it for later. Add `&auth.IdentityLink{}` to the app's
          `AutoMigrate` (`internal/platform/database.go`), then generate and
          apply the migration (`gombit db makemigrations --model
          github.com/gombit-dev/gombit/auth.IdentityLink`, `gombit db
          migrate`); `gombit upgrade --dry-run` lists the steps.
        schema:
          - {model: auth.IdentityLink, table: auth_identity_links, change: added}
        refs: [340]

      - id: external-identity
        kind: informational
        area: security
        summary: "External identity providers (OIDC / OAuth2): `framework.WithAuthIdentityProviders` registers adapters behind `auth.IdentityProvider` (an OpenID Connect one ships as the optional `auth/oidc`), and the auth routes mount sign-in, linking and unlinking under `{prefix}/auth/external`."
        details: |
          Nothing changes for an app that registers no provider. With one,
          the framework owns the state, nonce and PKCE pair (in an
          encrypted, single-flow `gombit_external` cookie), the mapping of
          identities to users, signup and the session: an identity no user
          linked makes an account only when the provider verified its email
          and no account has it (an account's owner links it, signed in), and
          an account with multi-factor authentication signs in with its
          password only. Linking needs the current password (an account
          without one links nothing until a reset); in Bearer mode the
          callback's `gombit_code` exchanges only from the browser that ran
          the flow (with its `gombit_external_code` cookie: the SPA's
          `fetch` of `/exchange` sends credentials). A password reset that
          ends the sessions also removes the user's links. It then registers
          `{prefix}/auth/external`,
          `/auth/external/{provider}/login`, `/link`, `/callback`,
          `/auth/external/exchange` (Bearer mode), `/auth/external/identities`
          and `/identities/{id}`, their `auth-external-*` operations, and the
          `AuthExternalProvider` / `AuthExternalStartBody` /
          `AuthExternalLinkBody` / `AuthExternalAuthorization` /
          `AuthExternalExchangeBody` / `AuthIdentityLink` schema names: an app
          with its own routes or types of those names renames them. An
          account an external sign-in made has no password
          (`User.HasUsablePassword`); a password reset gives it one. See
          docs/auth.md § External identity providers.
        refs: [340]

      - id: oidc-dependencies
        kind: informational
        area: dependency
        summary: "The framework newly requires `github.com/coreos/go-oidc/v3` v3.15.0, `github.com/go-jose/go-jose/v4` v4.1.2 and `golang.org/x/oauth2` v0.30.0 (the optional `auth/oidc` adapter)."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade; an app that does not import `auth/oidc` links
          none of them into its binary.
        refs: [340]

      - id: expired-rotated-refresh-token-no-cascade
        kind: informational
        area: security
        summary: "An already-rotated refresh token that has expired is a 401 and no longer revokes the user's sessions."
        refs: [458]

      - id: cookie-refresh-401-clears-session-cookies
        kind: informational
        area: behavior
        summary: "In cookie mode, a refresh rejected with a 401 clears the `gombit_access` and `gombit_refresh` cookies."
        details: |
          The OpenAPI document declares that 401 on the cookie-mode `refresh`
          operation, with its `Set-Cookie` header and the D10 error envelope.
        refs: [458]

      - id: client-schema-cookie-refresh-401
        kind: informational
        area: client
        summary: "A new cookie-mode app's placeholder `schema.ts` includes the refresh's 401 response; an existing app's generated client gets it from `gombit client generate`."
        refs: [458]

      - id: cookie-refresh-loads-user-before-commit
        kind: informational
        area: behavior
        summary: "In cookie mode, a `POST /auth/refresh` that fails loading the session user rolls the token rotation back with it, instead of answering 500 after the rotation already committed."
        refs: [606]

      - id: jobs-inspect-keeps-payload-bytes
        kind: informational
        area: cli
        summary: "`gombit jobs inspect` prints a job's payload as the queue holds it: an int64 above 2^53 keeps its digits and object keys keep the order the handler wrote them."
        details: |
          The human-readable block was re-encoded through `any`, so a snowflake
          id or an int64 primary key showed a neighbouring value the job never
          carried, keys came back sorted, and a number the producer wrote
          non-canonically (`1e3`) was rewritten as `1000`. `inspect --json` was
          already faithful. Nothing to change: the printed value is now the
          stored one, and `json.Indent` moves only whitespace. Markup is not
          part of that change, and cannot be: `Registry` and `Envelope.Marshal`
          encode with `json.Marshal`, which escapes `<`, `>` and `&` as
          `\u003c`, `\u003e` and `\u0026` on the way into the queue, so
          `inspect` prints those escapes as stored before and after.
        refs: [497]

      - id: nested-required-property-keyed-by-its-path
        kind: informational
        area: behavior
        summary: "A 422 keys a missing property by that property's own path at every location Huma reports it (`address.city`, `body[1].sku`, `query.filter.kind`), including a `dependentRequired` property, instead of by the object."
        details: |
          Huma reports a missing property — required, or pulled in by
          `dependentRequired` — against the object that lacks it, whether that
          is a nested body object, a top-level array-body item (`body[1]`), a
          deepObject query param or a form object, so the parent key carried
          every property the object was missing. A form that passes
          `error.fields` to React Hook Form field paths needs no change — that
          is the key it always wanted; code that read the parent key reads the
          property path now.
        refs: [503]

      - id: dotenv-comments-and-byte-order-mark
        kind: manual
        breaking: true
        area: behavior
        summary: "A `.env` value no longer swallows a trailing comment, a byte order mark no longer hides the first key, and a `.env` that cannot be read fails the load."
        details: |
          Check a `.env` you already run with. A `#` with whitespace before it
          now starts a comment outside quotes, so `KEY=abc # note` reads as
          `abc` and `GOMBIT_LOG_LEVEL="debug" # local` as `debug`; a value that
          really contains ` #` needs double or single quotes, and a `#` with no
          whitespace before it is still part of the value (`COLOR=#fff`, and a
          `#`-prefixed `GOMBIT_JWT_SECRET`). These matched `set -a; . ./.env`,
          which the scaffold's own `.env` documents as an alternative way to
          start the app. A UTF-8 byte order mark is dropped from the start of
          the file, where alone it can be; there it made the first key match no
          variable. And a `.env` that exists but cannot be read now fails
          `config.Load` and `config.LoadFromDir` instead of contributing
          nothing silently, which could boot an app with no JWT secret and so
          with auth unmounted. `export KEY=v` is unchanged: it assigns a key
          literally named `export KEY`, because that literal grammar is the one
          `config.DotEnvKeys` reports to this tooling's own configuration
          analysis.
        refs: [507]

      - id: app-binary-reports-framework-version
        kind: informational
        area: cli
        summary: "An app's own `cmd/gombit` reports the framework it was built against, not the application: `gombit version` prints that release and `gombit new` pins it, instead of the app's version."
        details: |
          It read `debug.BuildInfo.Main`, the framework in the framework's
          binary but the app in a generated one, so an app tagged `v1.4.5`
          printed `v1.4.5` and `gombit new` from it pinned the framework to
          that release; an app's own pseudo-version pinned one the proxy
          resolves to unrelated commits, silently, because a pseudo-version is
          a valid module version. A `v2` or later app tag printed too but never
          pinned the app's version: `ResolveFrameworkVersion` refuses a major
          the framework's module path could not carry, so `gombit new` warned
          and wrote `v0.0.0`, as it did for a source build. The framework's
          `BuildInfo.Deps` entry is used when the main module is not
          `github.com/gombit-dev/gombit`; a replace by a local checkout or a
          fork names no release, so those report `dev`, as a `go.mod` read the
          same way does. An app binary also stops printing `commit` and
          `built`, which describe the main module. A script that parsed the
          old app-version output reads a different string now.
        refs: [512]

      - id: logout-follows-rotated-token
        kind: informational
        area: security
        summary: "Logout with a refresh token that has already rotated ends the session it rotated into; it answered 200 and revoked nothing."
        details: |
          `POST {prefix}/auth/logout` (both auth modes) and
          `auth.Service.RevokeRefresh` revoked only the token they were given,
          and only while it was unrevoked. A token a refresh had rotated (a
          silent refresh in flight when the user clicked "Log out") matched
          nothing, so the user believed they were signed out while the
          session lived on, refreshable, until it expired. The logout now
          follows the token's successors to the session's current token and
          revokes that, under the user's lock that rotation takes, so a logout
          racing a refresh of the same token ends the session either way. Any
          unexpired token the session has had, fewer than 1000 rotations behind
          its current token, ends it. The `auth.logout` audit
          event now names the session it ended (`target_type` session) and
          carries `"via":"rotated"` when an old token ended it. A rotated
          token past its own expiry, or the token of a session already ended,
          still ends nothing and succeeds. A token 1000 or more rotations behind
          its session's current token (a 10-minute access TTL with the default
          7-day refresh TTL makes 1008 rotations), or one whose chain cannot be
          followed (a successor row gone), answers 500 and ends nothing; revoke
          the session instead (`DELETE {prefix}/auth/sessions/{id}`, or
          `?scope=all`). Nothing to
          change.
        refs: [466]

      - id: bcrypt-cost-range-checked
        kind: manual
        breaking: true
        area: api
        summary: "`Auth.BcryptCost` must be 0 (bcrypt's default) or between 4 and 31: `config.Validate` and `auth.NewService` refuse any other value, so an app configured outside that range no longer starts."
        details: |
          `config.Validate` refused only a negative cost. A cost of 1 to 3
          passed and bcrypt silently hashed at its default, 10, and a cost of
          32 or more passed and then failed every new hash: registration and
          `createsuperuser` answered `500` while existing users could still
          sign in. Both are refused at startup now, with
          `config: Auth.BcryptCost`. An app that sets `Config.Auth.BcryptCost`
          in code sets it to 0 or to a value from 4 to 31: the cost its stored
          hashes carry (the `$2a$NN$` prefix, or `bcrypt.Cost` of a stored
          hash), so the unknown-email timing hash matches them. For 1 to 3
          that is 0 (or 10), the cost bcrypt made them at; for 32 or more,
          which made no hashes, the cost the app ran with before, usually 0.
          Hashes already stored keep working at whatever cost they were made
          at.
        refs: [465]

      - id: bearer-scheme-case-insensitive
        kind: informational
        area: behavior
        summary: "The `Authorization` header's `Bearer` scheme is matched case-insensitively: `bearer <token>` and `BEARER <token>` authenticate instead of answering 401."
        details: |
          RFC 9110 defines the authentication scheme as case-insensitive, and
          some HTTP clients, proxies and API gateways send `bearer`. The Bearer
          gate (`auth.Service.RequireBearer`, `GET {prefix}/me` and the other
          framework operations behind it) matched the exact prefix `Bearer `,
          so those requests got `401` "missing bearer token". Only previously
          refused requests change; nothing to do.
        refs: [464]

      - id: ensure-permission-group-concurrent-first-use
        kind: informational
        area: behavior
        summary: "`auth.EnsurePermission` and `auth.EnsureGroup` return the one row to every concurrent first caller instead of failing the race's losers with a duplicate-key error."
        details: |
          Each checked for the row and inserted it when missing, so callers
          ensuring the same new key at once all inserted, and every one but
          the first got `duplicated key not allowed`: an app seeding its
          permissions at boot could fail to start on all but one replica. The
          insert now runs under a savepoint and a unique violation re-reads
          the winner's row (with a shared lock, so a caller inside a MySQL
          REPEATABLE READ transaction sees it); inside a transaction the lost
          race no longer aborts it on PostgreSQL. This holds outside a
          transaction and inside one at READ COMMITTED or on MySQL. A caller
          inside a PostgreSQL REPEATABLE READ or SERIALIZABLE transaction
          cannot see the winner's row, so it still gets the unique violation
          (or a serialization failure) and must retry the whole transaction;
          keep a retry an app has there. A unique violation on another
          constraint (the primary key, its sequence behind the table) is
          returned as itself. Nothing to change.
        refs: [463]

      - id: api-prefix-canonical-form
        kind: manual
        breaking: true
        area: config
        summary: "`GOMBIT_API_PREFIX` and `Config.API.Prefix` have one canonical form: `Load` drops a trailing `/` from the environment value, and `Validate` refuses a prefix that is not already canonical — one `Load` would have rewritten, or one whose OpenAPI document its own routes cannot answer."
        details: |
          A prefix of `/svc/` served `/svc/widgets` but listed
          `/svc//widgets` in the OpenAPI document, so every client generated
          from it asked for a URL that 404s. `Load` normalises a trailing
          slash away, so `GOMBIT_API_PREFIX=/svc/` still starts the app and
          serves what it always served. Trailing slashes are the only thing
          `Load` rewrites: `main` checked a prefix for no more than a
          leading `/`, so a value the rules below refuse started an app and
          now fails `Load` from the environment — `GOMBIT_API_PREFIX=/api/v 1`
          is one. A prefix set in code is never rewritten, so
          `Config.API.Prefix = "/svc/"` now fails `Validate` with a field error
          naming `API.Prefix`; write it without the trailing slash.
          What still works is what an IRI path segment holds: letters, digits,
          `- . _ ~`, the sub-delimiters `! $ & ' ( ) + , ; =`, `@`, and
          non-ASCII in valid UTF-8 — `/api/v1+beta`, `/@acme/api`, `/api;v=1`
          and `/café` each register, advertise and answer the same path key.
          `Validate` refuses each prefix below; for all but the last, the
          document and the routes measurably disagree. `%`, `?`, `#` and
          control characters, which make the advertised path one no client
          can send as it is written; Gin's `:` and `{name}` parameters and
          its `*` catch-all, whose routes answer paths the document never
          lists (a `*` or `\` mid-path panics at registration); a `.` or
          `..` segment, which Gin's `path.Join`
          collapses, so the app registers the collapsed route — `/api/../v1`
          plus `/widgets` answers `/v1/widgets` — while the document
          advertises the uncollapsed path it was given, and that advertised
          path is the one with no route; an empty segment (`/svc//api`), the
          double slash being what makes a prefix non-canonical; and bytes that
          are not valid UTF-8 (`/api/\xff`), which encoding/json replaces with
          U+FFFD while writing the document, so the advertised key 404s while
          the route answers 200. Space and the other US-ASCII characters RFC
          3986 keeps out of a URI (`" < > [ ] | ^ \``) are refused on purpose,
          not because anything was measured failing with them. RFC 3986
          excludes non-ASCII too, but the accepted set is RFC 3987's IRI path
          segment (`ipchar`), which admits it; a client sends it percent-encoded
          and Gin matches the route once it is decoded.
        config:
          - {var: GOMBIT_API_PREFIX, change: refused}
        refs: [501]

      - id: sqlite-reset-drops-sqlite-named-tables
        kind: informational
        area: cli
        summary: "`gombit db reset` on SQLite drops every user table and view, including one whose name starts with `sqlite` but not `sqlite_` (`sqlitex_cache`, `sqlite3_import`); only SQLite's reserved `sqlite_` objects are kept."
        details: |
          The filter's `_` was a `LIKE` wildcard, so such tables survived the
          reset and the re-applied migrations then failed on them.
        refs: [491]

      - id: new-validates-module-path
        kind: informational
        area: cli
        summary: "`gombit new --module` refuses a module path Go does not accept (`golang.org/x/mod/module.CheckPath`), before writing anything, instead of scaffolding an app that cannot build."
        refs: [515]

      - id: new-dev-null-stdin-non-interactive
        kind: informational
        area: cli
        summary: "`gombit new` with stdin from `/dev/null` (or another non-terminal character device) is non-interactive: without a project name it fails with the documented error instead of prompting."
        refs: [516]

      - id: database-and-cache-driver-updates
        kind: informational
        area: dependency
        summary: "The framework requires newer drivers: `github.com/mattn/go-sqlite3` v1.14.53, `github.com/redis/go-redis/v9` v9.23.0 and `ariga.io/atlas` v1.3.0 (the migration library, not the `atlas` CLI)."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade.
        refs: [537, 644, 657]

      - id: aws-sdk-v1-47-8
        kind: informational
        area: dependency
        summary: "The framework requires newer AWS SDK for Go v2 modules (the S3 storage driver): `github.com/aws/aws-sdk-go-v2` v1.47.8, `/credentials` v1.20.16, `/service/s3` v1.114.6 and `github.com/aws/smithy-go` v1.28.8."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade.
        refs: [625, 645, 649, 658]

      - id: contract-dependency-updates
        kind: informational
        area: dependency
        summary: "The framework requires `github.com/danielgtaylor/huma/v2` v2.40.0, `github.com/pb33f/libopenapi` v0.42.4 and `github.com/pb33f/libopenapi-validator` v0.16.1."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade. The framework's OpenAPI document and contract
          checks are unchanged by them (the contract drift gates pass).
        refs: [589, 607, 641, 643, 655]

      - id: otel-and-golang-x-updates
        kind: informational
        area: dependency
        summary: "The framework requires OpenTelemetry for Go v1.47.0 (`go.opentelemetry.io/otel`, `/sdk`, `/trace`) and newer `golang.org/x` modules: `crypto` v0.58.0, `mod` v0.42.0, `net` v0.62.0, `sys` v0.50.0, `term` v0.47.0 and `tools` v0.52.0."
        details: |
          Go's minimal version selection moves an app's build to them with the
          framework upgrade.
        refs: [572, 573, 621, 622, 624, 642, 656]

  - version: v0.10.0
    changes:
      - id: session-id-schema
        kind: manual
        breaking: true
        area: schema
        summary: "Stable session ids add `refresh_tokens.session_id`, which every login and refresh writes: an app migrates before it runs this release."
        details: |
          `auth.RefreshToken` gains `SessionID` (indexed). Until the column
          exists, every login and every token refresh fails (the insert names
          every column of the model). Generate and apply the migration
          (`gombit db makemigrations`, `gombit db migrate`) before deploying;
          `gombit upgrade --dry-run` lists the steps. Existing rows keep a
          NULL `session_id` and nothing has to be backfilled: such a session
          keeps the id it was listed under, which its next refresh stores.
          A refresh by an older binary on the migrated schema (a rolling
          deploy, a rollback that kept the column) writes a NULL
          `session_id` too; the session is then listed under that row's id,
          and logout still finds its current token along `replaced_by`.
        schema:
          - {model: auth.RefreshToken, table: refresh_tokens, change: altered}
        refs: [661]

      - id: stable-session-ids
        kind: informational
        area: api
        summary: "A session's id in `GET {prefix}/auth/sessions` stays the same for the session's whole life, so `DELETE {prefix}/auth/sessions/{id}` with an id listed before a refresh ends the session instead of answering 404."
        details: |
          The id was derived from the session's current refresh token row and
          changed on every refresh; it is now drawn at login and carried to
          every rotation (32 lowercase hex characters, as before). A client
          that listed again after a 404 keeps working. The audit trail's
          `session` targets (logout, refresh reuse within grace) name the same
          stable id, so one session's events share it.
        refs: [661]

      - id: logout-follows-session-id
        kind: informational
        area: behavior
        summary: "A logout with a token any number of rotations behind its session's current one ends the session; the 1000-rotation limit (a 500) applies only along rows written without a session id."
        details: |
          The logout, and the signing out of other sessions that a password
          change or MFA enrollment does, find the session's current token by
          its id in one read instead of following the rotation chain one row
          at a time. Rows written without the id (before the upgrade, or by
          an older binary during a rolling deploy) are still followed along
          the chain, which ends with their expiry.
        refs: [661]

      - id: scaffold-sessions-page
        kind: informational
        area: scaffold
        summary: "A new app has a sessions page (`/sessions`, `frontend/src/pages/SessionsPage.tsx`) listing the signed-in user's sessions and signing them out; an app scaffolded before has none."
        details: |
          The page is app-owned, so nothing adds it to an existing app. To
          add it, copy `frontend/src/pages/SessionsPage.tsx` from an app
          `gombit new` writes with the same `--ui` and `--auth`, add its
          route (`<Route path="sessions" element={<SessionsPage />} />`
          beside the others in `src/app/router.tsx`) and a link to
          `/sessions` in `src/layouts/AppLayout.tsx`. It uses
          `GET`/`DELETE {prefix}/auth/sessions` and the device fields
          `user_agent`, `client_address` and `location`, so it needs this
          release's server and client.
        refs: [663]

      - id: session-device-schema
        kind: manual
        breaking: true
        area: schema
        summary: "Session device metadata adds `refresh_tokens.user_agent`, `client_address` and `location`, which every login and refresh writes: an app migrates before it runs this release."
        details: |
          `auth.RefreshToken` gains `UserAgent`, `ClientAddress` and
          `Location`. Until the columns exist, every login and every token
          refresh fails (the insert names every column of the model). The
          same migration as `session-id-schema` adds them: generate and apply
          it (`gombit db makemigrations`, `gombit db migrate`) before
          deploying. Existing rows keep NULLs, listed as empty: a session
          from before the upgrade shows no device, and nothing has to be
          backfilled.
        schema:
          - {model: auth.RefreshToken, table: refresh_tokens, change: altered}
        refs: [662]

      - id: session-device-metadata
        kind: informational
        area: config
        summary: "`GET {prefix}/auth/sessions` shows the device each session signed in from: `user_agent`, `client_address` (its network by default, `GOMBIT_AUTH_SESSION_CLIENT_ADDRESS`) and `location` (from an app's `SessionLocator`)."
        details: |
          `AuthSession` gains three string fields, always present, empty when
          unknown. They are the sign-in request's and refreshes keep them.
          The client address is coarsened to an IPv4 /24 or IPv6 /48 unless
          `GOMBIT_AUTH_SESSION_CLIENT_ADDRESS` is `full` (or `none`, no
          address); the framework does no geolocation, and
          `framework.WithAuthSessionLocator` is how an app names locations.
          Regenerate the TypeScript client (`gombit client generate`) to
          see the fields.
        config:
          - {var: GOMBIT_AUTH_SESSION_CLIENT_ADDRESS, change: added}
        refs: [662]

      - id: generate-after-field-removal
        kind: informational
        area: cli
        summary: "`gombit generate` regenerates a resource whose model lost, renamed or retyped a field, whose `*.gen.go` were deleted or conflicted, or whose `*.gen.go` call a framework API an upgrade changed, instead of failing with a Go compile error from the stale generated files."
        details: |
          The loader compiles each resource package, and after a field was
          removed, renamed or retyped the committed `*.gen.go` (or, once those
          were deleted, a `hooks.go` using their types) no longer built against
          the model: `gombit generate`, `--check` and `gombit upgrade contract`
          failed with a compile error, and `--check` reported no drift. The
          same held after an upgrade changed a framework API the old
          `*.gen.go` call: v0.8.0's `database-search-takes-context` note says
          to run `gombit generate`, which could not run. When the package
          does not build as it is, the loader now runs once more with the
          files declaring the model and the hand-written files declaring a
          name it uses (an enum type of the package) only, the rest stubbed (a
          file that does not parse, such as a `*.gen.go` with merge-conflict
          markers, included), and prints a notice that the package did not
          build. A model needing more than that still needs the package to
          build. Nothing to change; a `hooks.go` that uses a removed field
          must be updated by hand after regenerating, as before (run `go
          build`).
        refs: [467]

      - id: local-storage-windows-file-deleted-not-found
        kind: informational
        area: behavior
        summary: "On Windows, `storage/local` reports an object a concurrent `Delete` is removing as `storage.ErrNotFound` from `Open` and `Stat`, not as an \"Access is denied\" error."
        details: |
          An open racing a POSIX-semantics delete of the same file can fail
          with `ERROR_ACCESS_DENIED` and NTSTATUS `STATUS_FILE_DELETED`; the
          driver mapped only `STATUS_DELETE_PENDING` to not-found, so a read
          racing a delete could fail with a permission error. Nothing to
          change.
        refs: [639]

      - id: scaffold-registers-every-framework-model
        kind: manual
        area: scaffold
        summary: "`gombit new` puts every framework model in the bootstrap migration and `models.json`; an app created by `gombit new` v0.9.0 lacks five auth models there, so its next migration fails with `table ... already exists`."
        details: |
          `gombit new` v0.9.0 left `auth.OneTimeToken`, `auth.AuditEvent`,
          `auth.TOTPFactor`, `auth.RecoveryCode` and `auth.IdentityLink` out of
          the bootstrap migration and `database/migrations/models.json`, while
          the `AutoMigrate` it writes creates their tables at startup. `gombit
          db check` reports them as auto-migrated with no migration, and the
          next migration generated (by `gombit make resource`, or `gombit db
          makemigrations --model` for them) creates those tables, so applying
          it to a database the app has started against fails because they
          already exist (on SQLite, `table auth_one_time_tokens already
          exists`). Only apps created by `gombit new` v0.9.0 are
          affected: an app upgraded to v0.9.0 generated these models'
          migration, as its upgrade notes ask.

          In an affected app, take the migration that creates those five
          tables, or generate it with `gombit db makemigrations auth_tables`
          and a `--model github.com/gombit-dev/gombit/auth.<Name>` for each.
          Add `IF NOT EXISTS` to each of its statements that creates one of
          them and, on SQLite and PostgreSQL, to each that creates one of
          their indexes (MySQL declares them inside `CREATE TABLE`); leave
          its other statements as they are. Run `gombit db repair` to update
          `atlas.sum`, then `gombit db migrate` in each environment: a
          database that has the tables keeps them and their rows, and one
          that does not gets them. `gombit db check` then reports the schema
          chain consistent.
        refs: [675]

      - id: db-check-without-automigrate
        kind: informational
        area: cli
        summary: "`gombit db check` skips its model-registry layer when `internal/platform/database.go` has no `AutoMigrate` call, instead of failing with \"no AutoMigrate call\", and `gombit db makemigrations --forget-model` no longer fails there."
        details: |
          An app whose schema comes from its migrations may keep
          `internal/platform/database.go` to open the database and call no
          `AutoMigrate` method there. The file then lists no models to hold
          `models.json` to, so the layer is skipped, as for an app without the
          file; a model the app migrates some other way (`auth.Migrate`, or a
          helper in another file) is not seen. `gombit make resource` still
          needs the call, and so does `gombit generate` (and `db check`'s
          generated-contract layer) once the app has a model-first resource.
          Nothing to change.
        refs: [675]

