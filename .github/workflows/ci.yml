name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# GOTOOLCHAIN=local: never let `go` reach out for a different toolchain than
# actions/setup-go already installed. GOPROXY with `|` (not `,`) falls back to
# `direct` on ANY proxy/network failure, not just 404/410 — proxy.golang.org
# intermittently drops connections mid-fetch (issue #208) and the default
# `,`-joined GOPROXY doesn't fail over for that. ATLAS_VERSION pins the Atlas
# CLI installed below in one place so CI never silently picks up a canary
# build (the unpinned installer defaults to "latest", which has resolved to a
# canary here before).
env:
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org|direct
  ATLAS_VERSION: "v1.3.0"

# Pipeline: lint → build → test → (database ∥ migrations ∥ conformance ∥ contract-drift ∥ benchmark-report-drift)
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        run: go build ./...

      # Docs promise these compile. The tutorial example in particular is the
      # committed output of docs/tutorial.md and must not rot.
      - name: Build examples
        run: go build ./examples/...

  ci-scripts:
    name: CI script tests
    # Mirrors the benchmark-scripts job below: hermetic bash tests (stubs
    # `go`/`sleep`, no real network or waiting) for the scripts/ helpers
    # every migration/conformance job below relies on — catches a regression
    # in the retry/backoff logic before any of those jobs actually depend on
    # it, not folded into `build` so the two script-test surfaces (top-level
    # scripts/, benchmarks/scripts/) stay in one place each.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI script tests
        run: bash scripts/ci-prefetch-go-modules_test.sh

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run admin UI tests
        working-directory: internal/adminui
        run: npm ci && npm test

      # Parallel packages all shell out to npx; a cold _npx extract races
      # (TAR_ENTRY_ERROR / missing js-yaml) and fails client generation tests.
      - name: Warm npx openapi-typescript cache
        run: npx --yes openapi-typescript@7.13.0 --help >/dev/null

      # This package's test suite includes a real `go run` of the generated
      # Atlas GORM loader (TestMakeMigrationsGeneratedLoaderUsesRealGormschema),
      # which needs ariga.io/atlas-provider-gorm's full module graph resolved
      # ahead of time (issue #208).
      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run tests
        env:
          GOPROXY: "off"
        run: go test ./...

  contract-drift:
    name: Contract drift
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Regenerate sample spec and client
        run: go run ./cmd/gombit client check --write --spec examples/client/openapi.json --out examples/client/frontend/src/api/generated

      - name: Fail on contract drift
        run: git diff --exit-code -- examples/client/openapi.json examples/client/frontend/src/api/generated

  benchmark-report-drift:
    name: Benchmark report drift
    # Only needs the Go toolchain + the committed README/results; it does not
    # consume `test`'s output, so it gates on build for faster time-to-signal.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pure-Go, no Docker: regenerate the README ## Performance block from the
      # committed benchmarks/results/latest/ and fail if it changed (issue #141
      # §9: Markdown is derived, never hand-edited). Regenerate-then-diff mirrors
      # the contract-drift job, so a failure shows the exact hunk in the log. The
      # heavier benchmark-smoke job that builds the six app images is separate.
      - name: Regenerate the README performance block
        run: make benchmark-report

      - name: Fail on benchmark report drift
        run: git diff --exit-code -- README.md

  benchmark-smoke:
    name: Benchmark smoke
    # Correctness-only guard for the benchmark suite (issue #141 §11): build all
    # six app images (a broken Dockerfile fails here) and run the containerized
    # harness end to end (compose up -> migrate -> seed -> k6 -> parse) for ALL
    # SIX apps with a tiny deterministic seed (BENCH_SEED_*) and a 1-VU x 1 short
    # trial. Detects broken builds, broken endpoints, schema/migration drift,
    # orchestration failures, and result-parser breakage. Numbers are discarded
    # (throwaway out-dir); only success/failure matters (no perf gate on noisy
    # shared runners, per §11). The small seed is what keeps all six affordable
    # per PR. Docker + Compose v2 are preinstalled on ubuntu-latest; k6 and
    # Postgres run as pinned images.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmark smoke
        run: make benchmark-smoke

  benchmark-scripts:
    name: Benchmark script tests
    # The benchmark orchestration/dispatch scripts carry Docker-free stub tests
    # (they fake docker/compose/make and go seams), so run them in merge CI —
    # without this, nothing in the pull_request graph exercises the run-suite /
    # benchmark-smoke / crud-all / footprint mappings and a broken one merges
    # green. Pure bash + make; no Docker, no real benchmark run.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # run-crud-all_test.sh derives gombit's version via `git describe
          # --tags` and asserts it is version-shaped. The default depth-1,
          # tagless clone would make describe fall back to a bare SHA and fail
          # that assertion, so fetch full history + tags.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmark script tests
        run: |
          bash benchmarks/scripts/run-suite_test.sh
          bash benchmarks/scripts/benchmark-target_test.sh
          bash benchmarks/scripts/run-crud-all_test.sh
          bash benchmarks/scripts/footprint-all_test.sh

  database-sqlite:
    name: Database (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SQLite database tests
        run: go test ./database

  database-postgres:
    name: Database (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres database tests
        run: |
          go test -tags integration ./database \
            -database.postgres-dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          go test -tags integration ./auth \
            -auth.postgres-dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          go test -tags integration ./admin \
            -admin.postgres-dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

      # Separate database from the auth/database/admin tests above: gin-gorm's
      # User model maps to a "users" table, same as auth.User, and the two
      # have different columns -- sharing a database would let one
      # AutoMigrate silently alter the schema the other relies on.
      - name: Create benchmarks database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench;'

      - name: Run gin-gorm benchmark app integration tests
        run: |
          go test -tags integration ./benchmarks/apps/gin-gorm/... \
            -database.dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit_bench?sslmode=disable'

      # A third, separate database: the gombit benchmark app applies its
      # schema via a real Atlas migration (committed under
      # benchmarks/apps/gombit/database/migrations/), not AutoMigrate, so it
      # can't safely share gombit_bench's already-AutoMigrate'd tables
      # either.
      - name: Create gombit benchmark app database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench_gombit;'

      - name: Install Atlas CLI
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --community
          atlas version

      - name: Apply gombit benchmark app migration
        working-directory: benchmarks/apps/gombit
        env:
          GOMBIT_DATABASE_DRIVER: postgres
          GOMBIT_DATABASE_DSN: postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_gombit?sslmode=disable
        run: go run github.com/gombit-dev/gombit/cmd/gombit db migrate

      # -p 1: this expands to two packages (benchmarks/apps/gombit and its
      # internal/project), each a separate test binary that TRUNCATEs the
      # same gombit_bench_gombit tables at the start of every test. go test
      # runs different packages' binaries in parallel by default (bounded by
      # -p, which defaults to GOMAXPROCS) — reproduced locally by racing the
      # two binaries against one database directly: both failed on every one
      # of 15 runs (one package's TRUNCATE landing mid-assertion in the
      # other). -p 1 serializes the two binaries so only one truncates the
      # shared tables at a time.
      - name: Run gombit benchmark app integration tests
        run: |
          go test -tags integration -p 1 ./benchmarks/apps/gombit/... \
            -database.dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_gombit?sslmode=disable'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/apps/django/requirements.txt

      - name: Install django benchmark app dependencies
        run: pip install -r benchmarks/apps/django/requirements.txt

      # No "create database" step needed here, unlike gin-gorm/gombit above:
      # Django's own test runner creates and destroys a throwaway
      # test_gombit_bench_django database itself (verified locally by
      # pointing DATABASE_URL at a database that doesn't exist yet and
      # running the suite unmodified — it still passes), so the target
      # database name in DATABASE_URL never needs to exist beforehand.
      - name: Run django benchmark app tests
        working-directory: benchmarks/apps/django
        env:
          DATABASE_URL: postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_django?sslmode=disable
        run: python manage.py test projects -v 2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          working-directory: benchmarks/apps/rails
          bundler-cache: true

      # Unlike Django's manage.py test (verified to create its own
      # throwaway test database even when the target name doesn't exist
      # yet), Rails' bin/rails test does not auto-create a missing database
      # — verified locally by pointing DATABASE_URL at a nonexistent
      # database and getting a connection failure, not an auto-created one.
      - name: Create rails benchmark app test database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench_rails_test;'

      - name: Run rails benchmark app tests
        working-directory: benchmarks/apps/rails
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_rails_test?sslmode=disable
        run: bin/rails test

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, mbstring, bcmath
          tools: composer:v2
          coverage: none

      - name: Install laravel benchmark app dependencies
        working-directory: benchmarks/apps/laravel
        run: composer install --no-interaction --prefer-dist --no-progress

      # Like Rails' bin/rails test (and unlike Django's manage.py test),
      # Laravel's RefreshDatabase migrates but does not create the database
      # itself — a dedicated test database it will migrate:fresh into, kept
      # separate from the auth/gin-gorm/gombit/django/rails databases.
      - name: Create laravel benchmark app test database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench_laravel_test;'

      - name: Run laravel benchmark app tests
        working-directory: benchmarks/apps/laravel
        env:
          DB_CONNECTION: pgsql
          DATABASE_URL: postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_laravel_test?sslmode=disable
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: benchmarks/apps/nestjs/package-lock.json

      - name: Install nestjs benchmark app dependencies
        working-directory: benchmarks/apps/nestjs
        run: npm ci

      # Verify the app compiles (the production path is compiled output, issue
      # #141 §17), then run the suite. The tests run the migrations on the
      # connected database themselves (helpers.createTestApp), but do not
      # create it — a dedicated test database, kept separate from the others.
      - name: Build nestjs benchmark app
        working-directory: benchmarks/apps/nestjs
        run: npm run build

      - name: Create nestjs benchmark app test database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench_nestjs_test;'

      - name: Run nestjs benchmark app tests
        working-directory: benchmarks/apps/nestjs
        env:
          DATABASE_URL: postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_nestjs_test?sslmode=disable
        run: npm test

  database-mysql:
    name: Database (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MySQL database tests
        run: |
          go test -tags integration ./database \
            -database.mysql-dsn \
            'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          go test -tags integration ./auth \
            -auth.mysql-dsn \
            'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          go test -tags integration ./admin \
            -admin.mysql-dsn \
            'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  migrations-sqlite:
    name: Migrations (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --community
          atlas version

      # `go test ./migrations` includes the same generated-loader path as the
      # `test` job's TestMakeMigrationsGeneratedLoaderUsesRealGormschema.
      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run migration unit and Atlas smoke tests
        env:
          ATLAS_BINARY: atlas
          GOPROXY: "off"
        run: go test ./migrations ./cmd/gombit

  migrations-postgres:
    name: Migrations (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run Postgres migration integration tests
        env:
          GOPROXY: "off"
        run: >-
          go test -tags integration ./migrations
          -migrations.postgres-dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

  migrations-mysql:
    name: Migrations (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run MySQL migration integration tests
        env:
          GOPROXY: "off"
        run: >-
          go test -tags integration ./migrations
          -migrations.mysql-dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  conformance-sqlite:
    name: Conformance (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --community
          atlas version

      # harness.prepareSchema() runs the same generated-loader path as the
      # `test` job's TestMakeMigrationsGeneratedLoaderUsesRealGormschema.
      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run SQLite conformance suite
        env:
          ATLAS_BINARY: atlas
          GOPROXY: "off"
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver sqlite
          -count=1

  conformance-postgres:
    name: Conformance (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --community
          atlas version

      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run Postgres conformance suite
        env:
          ATLAS_BINARY: atlas
          GOPROXY: "off"
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver postgres
          -conformance.dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          -count=1

  conformance-mysql:
    name: Conformance (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --community
          atlas version

      - name: Pre-fetch Go modules
        run: bash scripts/ci-prefetch-go-modules.sh

      - name: Run MySQL conformance suite
        env:
          ATLAS_BINARY: atlas
          GOPROXY: "off"
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver mysql
          -conformance.dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          -count=1
